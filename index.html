<!DOCTYPE html>
<html>
    <head>
        <title>Campus	Club	Membership</title>
        <style>
            body {
                margin: 0;
                background-color: #f4f4f4;
                font-family: Arial, sans-serif;
            }
            h1{
                color:blue ;
                text-align:center;
            }
            .topnav {
                overflow: hidden;
                background-color: #333;
            }
            .topnav a {
                float: left;
                color: #f2f2f2;
                text-align: center;
                padding: 14px 16px;
                text-decoration: none;
                font-size: 17px;
            }
            .topnav a:hover {
                background-color: #ddd;
                color: black;
            }
            .topnav a.active {
                background-color: #04AA6D;
                color: white;
            }
            .card {
                position: relative;
                width: 400px;
                margin: 20px auto;
                padding: 15px;
                border: 2px solid #555;
                border-radius: 10px;
                background-color: white;
                box-shadow: 4px 4px 8px gray;
            }

            .card > h2 {
                margin-top: 0;
                color: #1d3974;
            }

            .card p {
                line-height: 1.4;
            }
            fieldset{
                width: 250px;
                margin: 20px;
                padding: 15px;
            }
        </style>
    </head>
    <body>
        <div class="topnav">
            <a class="active" href="#home">Home</a>
            <a href="#events">Events</a>
            <a href="#join">Join</a>
        </div>
        <h1>Programming	Club</h1>
        <div class="card">
            <h2>Club Membership</h2>
            <p>Join the Programming Club to take part in contests, workshops and weekly meetups.</p>
            <p id="events">Our club activities include programming events, robotics and debate.</p>
        </div>
        <form action="#" method="post">
            <fieldset id="join">
                <legend>Join the Club</legend>

                <div>
                    <label for="fullName">Full Name:</label>
                    <input type="text" id="fullName" name="fullName" minlength="3" required>
                </div>

                <div>
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div>
                    <label for="studentId">Student ID:</label>
                    <input type="text" id="studentId" name="studentId" placeholder="24-56789-1" pattern="[0-9]{2}-[0-9]{5}-[0-9]" required>
                </div>

                <div>
                    <label for="age">Age:</label>
                    <input type="number" id="age" name="age" min="17" max="40" required>
                </div>

                <div>
                    <span>Membership Type:</span><br>
                    <input type="radio" id="general" name="membershipType" value="General" required>
                    <label for="general">General</label>
                    <input type="radio" id="executive" name="membershipType" value="Executive" required>
                    <label for="executive">Executive</label>
                </div>

                <div>
                    <label for="preferredClub">Preferred Club:</label>
                    <select id="preferredClub" name="preferredClub">
                        <option value="">Select a club</option>
                        <option value="Programming">Programming</option>
                        <option value="Robotics">Robotics</option>
                        <option value="Debate">Debate</option>
                    </select>
                </div>

                <div>
                    <label for="reason">Why do you want to join?</label>
                    <textarea id="reason" name="reason" maxlength="200" required></textarea>
                </div>

                <div>
                    <input type="checkbox" id="agree" name="agree" required>
                    <label for="agree">I agree to the club rules</label>
                </div>

                <input type="submit" value="Join Now">
            </fieldset>
        </form>
    </body>
</html>
